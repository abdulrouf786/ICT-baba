name: Gold Broker Backtest Lab

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Twelve Data symbol (broker XAUUSD proxy)"
        required: true
        default: "XAU/USD"
      candles:
        description: "Historical candles (Twelve Data limit applies)"
        required: true
        default: "5000"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout ICT Baba
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries
        run: pip install pandas numpy requests
      - name: Run Gold strategy comparison
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_SYMBOL: ${{ inputs.symbol }}
          BACKTEST_OUTPUTSIZE: ${{ inputs.candles }}
          BACKTEST_INTERVAL: "5min"
          BACKTEST_RR: "2"
        run: python backtest_lab.py
      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-backtest-results
          path: |
            backtest_summary.csv
            backtest_trades.csv
          if-no-files-found: ignore

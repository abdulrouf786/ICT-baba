name: ICT Baba GitHub Data Provider

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ict-baba-github-data
  cancel-in-progress: true

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: pip install requests pandas
      - name: Fetch OHLC candles
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python github_data_provider/fetch_data.py
      - name: Commit updated market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ICT Baba market data"
            git push
          else
            echo "No market data changes to commit."
          fi

name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/python-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .

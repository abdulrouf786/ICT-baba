services:
  - type: web
    name: ict-baba-data-api
    runtime: python
    plan: free
    rootDir: data_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "20"
